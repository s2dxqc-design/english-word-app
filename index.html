<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.webmanifest"><title>My English Words V2.1</title><style>
:root{color-scheme:light dark;--bg:#f3f6fb;--card:#fff;--text:#172033;--sub:#667085;--line:#d8dfeb;--blue:#2563eb;--green:#15803d;--red:#b91c1c;--soft:#eef4ff}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#172135;--text:#f8fafc;--sub:#a7b2c4;--line:#334155;--soft:#1e293b}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:650px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}.title{font-weight:850;font-size:21px}.summary{font-size:13px;color:var(--sub);margin-top:4px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:11px 5px;border-radius:12px;font-weight:750}.tab.active{background:var(--blue);color:white}.panel{display:none}.panel.active{display:block}.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}.session{display:flex;justify-content:space-between;color:var(--sub);font-size:13px}.word{text-align:center;font-size:34px;font-weight:850;margin-top:22px;overflow-wrap:anywhere}.speak{display:block;margin:13px auto 0;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:10px 17px;font-size:16px}.meaning{margin-top:22px;background:var(--bg);border-radius:15px;min-height:66px;padding:19px;text-align:center;font-size:21px}.hint,.note{color:var(--sub);font-size:13px}.primary,.answer,.secondary{width:100%;border:0;border-radius:15px;padding:15px;font-weight:800;font-size:17px}.primary{margin-top:16px;background:var(--blue);color:white}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.bad{background:#fee2e2;color:#991b1b}.good{background:#dcfce7;color:#166534}.tools{display:grid;gap:9px;margin-top:13px}.file{text-align:center;border:1px dashed var(--blue);color:var(--blue);border-radius:13px;padding:13px;font-weight:750}.file input{display:none}.secondary{background:var(--card);color:var(--text);border:1px solid var(--line);font-size:14px;padding:12px}.hidden{display:none!important}.empty{text-align:center;color:var(--sub);padding:28px 5px}.message{text-align:center;min-height:21px;color:var(--sub);font-size:13px;margin-top:9px}.metricGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.metric{background:var(--soft);border-radius:14px;padding:12px 7px;text-align:center}.metric b{display:block;font-size:19px}.metric span{font-size:11px;color:var(--sub)}h2{font-size:18px;margin:19px 0 8px}.row{display:grid;gap:5px;border-top:1px solid var(--line);padding:12px 2px;font-size:13px}.daily{grid-template-columns:1.3fr .8fr .8fr .8fr}.weakrow{grid-template-columns:1.5fr .7fr .7fr}.head{font-weight:750;color:var(--sub)}
</style></head><body><main class="app"><div class="title">My English Words V2.1</div><div class="summary" id="topSummary">0語</div><nav class="tabs"><button class="tab active" data-panel="study">通常学習</button><button class="tab" data-panel="weak">苦手だけ</button><button class="tab" data-panel="history">履歴</button></nav>
<section id="study" class="panel active"><div class="card"><div id="empty" class="empty">CSVを読み込んで学習を始めます。</div><div id="quiz" class="hidden"><div class="session"><span id="modeLabel">通常学習</span><span id="timer">今日 00:00</span></div><div class="word" id="word"></div><button class="speak" id="speak">🔊 発音</button><div class="meaning"><span class="hint" id="masked">意味を考えてください</span><span id="meaning" class="hidden"></span></div><button class="primary" id="reveal">答えを見る</button><div class="answers hidden" id="answers"><button class="answer bad" id="bad">分からない</button><button class="answer good" id="good">分かった</button></div></div></div></section>
<section id="weak" class="panel"><div class="card"><div id="weakEmpty" class="empty">現在、苦手単語はありません。</div><button id="startWeak" class="primary hidden">苦手だけ復習を始める</button><div class="note" style="margin-top:12px">3回連続で「分かった」で苦手リストを卒業します。</div></div></section>
<section id="history" class="panel"><div class="metricGrid"><div class="metric"><b id="todayCount">0</b><span>今日の問題</span></div><div class="metric"><b id="todayAccuracy">0%</b><span>今日の正答率</span></div><div class="metric"><b id="todayTime">0分</b><span>今日の時間</span></div></div><div class="card"><h2>日ごとの履歴</h2><div class="row daily head"><span>日付</span><span>問題</span><span>正答率</span><span>時間</span></div><div id="dailyRows"></div><h2>苦手単語</h2><div class="row weakrow head"><span>単語</span><span>誤答</span><span>連続正解</span></div><div id="weakRows"></div></div></section>
<div class="tools"><label class="file">CSVを読み込む<input id="csv" type="file" accept=".csv,text/csv"></label><button class="secondary" id="reset">学習履歴をリセット</button></div><div id="msg" class="message" aria-live="polite"></div></main>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),K='myEnglishWords.v2';let data={words:[],daily:{}},current=null,mode='normal',last=Date.now();const dk=()=>new Date().toLocaleDateString('sv-SE');function save(){localStorage.setItem(K,JSON.stringify(data))}function load(){try{data=JSON.parse(localStorage.getItem(K)||'{"words":[],"daily":{}}')}catch{};data.words||=[];data.daily||={};render();if(data.words.length)next()}function day(){let k=dk();return data.daily[k]||(data.daily[k]={ok:0,ng:0,seconds:0})}
function parseLine(line,delim){let a=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){v+='"';i++}else q=!q}else if(c===delim&&!q){a.push(v.trim());v=''}else v+=c}a.push(v.trim());return a}function norm(s){return String(s||'').replace(/^﻿/,'').trim().toLowerCase().replace(/[ _-]/g,'')}
function parseCSV(text){text=String(text||'').replace(/^﻿/,'').replace(/
?/g,'
');let lines=text.split('
').filter(x=>x.trim());if(!lines.length)return[];let delim=(lines[0].split('	').length>lines[0].split(',').length)?'	':',';let rows=lines.map(x=>parseLine(x,delim));let h=rows[0].map(norm);let wordNames=['word','english','英単語','単語','英語'],meaningNames=['meaning','japanese','意味','日本語','和訳','訳'];let wi=h.findIndex(x=>wordNames.includes(x)),mi=h.findIndex(x=>meaningNames.includes(x));let start=1;if(wi<0||mi<0){if(rows[0].length>=2){wi=0;mi=1;start=0}else return[]}return rows.slice(start).filter(r=>String(r[wi]||'').trim()&&String(r[mi]||'').trim()).map(r=>({word:String(r[wi]).trim(),meaning:String(r[mi]).trim(),ok:0,ng:0,streak:0,weak:false,last:0}))}
function pool(){let l=mode==='weak'?data.words.filter(w=>w.weak):data.words,p=[];if(mode==='weak')return l;l.forEach(w=>{let n=Math.max(1,Math.min(9,1+(w.ng||0)*2-Math.min(w.ok||0,3)));while(n--)p.push(w)});return p}function panel(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.panel===id))}function next(){let p=pool();if(!p.length){current=null;panel(mode==='weak'?'weak':'study');render();return}current=p[Math.floor(Math.random()*p.length)];$('word').textContent=current.word;$('meaning').textContent=current.meaning;$('meaning').classList.add('hidden');$('masked').classList.remove('hidden');$('reveal').classList.remove('hidden');$('answers').classList.add('hidden');$('modeLabel').textContent=mode==='weak'?'苦手だけ復習':'通常学習';panel('study');render()}function ans(ok){let d=day();if(ok){current.ok++;current.streak++;d.ok++;if(current.weak&&current.streak>=3)current.weak=false}else{current.ng++;current.streak=0;current.weak=true;d.ng++}save();next()}function min(s){return s<60?Math.floor(s)+'秒':Math.round(s/60)+'分'}function safe(s){let x=document.createElement('div');x.textContent=s;return x.innerHTML}
function render(){let t=data.words.reduce((s,w)=>s+w.ok+w.ng,0),o=data.words.reduce((s,w)=>s+w.ok,0),weak=data.words.filter(w=>w.weak),d=day(),n=d.ok+d.ng;$('topSummary').textContent=`${data.words.length}語 ｜ 累計${t}問 ｜ 正答率${t?Math.round(o/t*100):0}% ｜ 苦手${weak.length}語`;$('empty').classList.toggle('hidden',data.words.length>0);$('quiz').classList.toggle('hidden',!data.words.length||!current);$('weakEmpty').classList.toggle('hidden',weak.length>0);$('startWeak').classList.toggle('hidden',!weak.length);$('todayCount').textContent=n;$('todayAccuracy').textContent=(n?Math.round(d.ok/n*100):0)+'%';$('todayTime').textContent=min(d.seconds||0);$('dailyRows').innerHTML=Object.keys(data.daily).sort().reverse().map(k=>{let x=data.daily[k],q=x.ok+x.ng;return `<div class="row daily"><span>${k}</span><span>${q}</span><span>${q?Math.round(x.ok/q*100):0}%</span><span>${min(x.seconds||0)}</span></div>`}).join('');$('weakRows').innerHTML=weak.sort((a,b)=>b.ng-a.ng).map(w=>`<div class="row weakrow"><span>${safe(w.word)}</span><span>${w.ng}</span><span>${w.streak}/3</span></div>`).join('');$('timer').textContent='今日 '+String(Math.floor((d.seconds||0)/60)).padStart(2,'0')+':'+String(Math.floor((d.seconds||0)%60)).padStart(2,'0')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.dataset.panel==='study'){mode='normal';next()}else{panel(b.dataset.panel);render()}});$('startWeak').onclick=()=>{mode='weak';next()};$('reveal').onclick=()=>{$('meaning').classList.remove('hidden');$('masked').classList.add('hidden');$('reveal').classList.add('hidden');$('answers').classList.remove('hidden')};$('good').onclick=()=>ans(true);$('bad').onclick=()=>ans(false);$('speak').onclick=()=>{if(!current)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(current.word);u.lang='en-US';u.rate=.82;u.volume=1;speechSynthesis.speak(u)};$('csv').onchange=e=>{let f=e.target.files[0];if(!f)return,r=new FileReader();r.onload=()=>{let nw=parseCSV(r.result);if(!nw.length){$('msg').textContent='CSVを読めませんでした。English/Japanese または word/meaning 列を確認してください。';return}let old=new Map(data.words.map(w=>[w.word.toLowerCase(),w]));data.words=nw.map(w=>{let x=old.get(w.word.toLowerCase());return x?{...w,ok:x.ok||0,ng:x.ng||0,streak:x.streak||0,weak:!!x.weak,last:x.last||0}:w});save();mode='normal';$('msg').textContent=`${data.words.length}語を読み込みました。`;next()};r.readAsText(f,'UTF-8')};$('reset').onclick=()=>{if(confirm('学習履歴と時間をリセットしますか？')){data.words.forEach(w=>Object.assign(w,{ok:0,ng:0,streak:0,weak:false}));data.daily={};save();next()}};setInterval(()=>{let now=Date.now(),delta=Math.min(2,(now-last)/1000);last=now;if(document.visibilityState==='visible'&&document.querySelector('#study.active')&&current){day().seconds=(day().seconds||0)+delta;render();if(Math.floor(day().seconds)%10===0)save()}},1000);document.addEventListener('visibilitychange',()=>{last=Date.now();save()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});load()})();</script></body></html>
